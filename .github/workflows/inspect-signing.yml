name: Inspect Adapter signing certificate

on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  inspect:
    runs-on: windows-latest
    steps:
      - name: Print public certificate identity
        shell: pwsh
        env:
          MIRRORPULSE_ADAPTER_SIGNING_PFX_BASE64: ${{ secrets.MIRRORPULSE_ADAPTER_SIGNING_PFX_BASE64 }}
          MIRRORPULSE_ADAPTER_SIGNING_PFX_PASSWORD: ${{ secrets.MIRRORPULSE_ADAPTER_SIGNING_PFX_PASSWORD }}
        run: |
          $ErrorActionPreference = 'Stop'
          $pfx = [Convert]::FromBase64String($env:MIRRORPULSE_ADAPTER_SIGNING_PFX_BASE64)
          $certificate = [Security.Cryptography.X509Certificates.X509Certificate2]::new($pfx, $env:MIRRORPULSE_ADAPTER_SIGNING_PFX_PASSWORD, [Security.Cryptography.X509Certificates.X509KeyStorageFlags]::EphemeralKeySet)
          try {
            Write-Output "Subject: $($certificate.Subject)"
            Write-Output "Thumbprint: $($certificate.Thumbprint)"
            Write-Output ([System.Security.Cryptography.X509Certificates.RSACertificateExtensions]::GetRSAPublicKey($certificate).ExportSubjectPublicKeyInfoPem())
          }
          finally { $certificate.Dispose() }